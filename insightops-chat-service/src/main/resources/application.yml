# 会话管理服务配置
# 经 Gateway 访问示例：http://localhost:8080/chat/sessions/createSession（需携带 token 请求头）

server:
  port: 8082
  servlet:
    context-path: /chat

spring:
  application:
    name: insightops-chat-service   # Nacos 注册名，Gateway 路由 lb://insightops-chat-service
  datasource:
    url: jdbc:mysql://localhost:3306/insightops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: DEFAULT_GROUP

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: mysql
  reasonable: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always

insightops:
  health:
    startup-log-enabled: true
