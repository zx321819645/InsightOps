server:
  port: 8081
  servlet:
    context-path: /auth

spring:
  application:
    name: insightops-auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/insightops?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: DEFAULT_GROUP

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

insightops:
  jwt:
    secret: zx040106
    expire-hours: 1
